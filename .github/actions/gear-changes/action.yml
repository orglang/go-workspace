name: gear-changes
description: Determine whether the current pull request changes CI, tests, or tooling

outputs:
  changed:
    description: Whether the current change set changes CI, tests, or tooling
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs.changed == 'true' }}

runs:
  using: composite
  steps:
    - name: Detect changes
      id: filter
      if: ${{ github.event_name == 'pull_request' }}
      uses: dorny/paths-filter@v4
      with:
        filters: |
          changed:
            - '.github/**'
            - 'test/**'
            - 'taskfile.yaml'
            - 'revive.toml'
            - 'staticcheck.conf'
            - '.gitignore'
