name: doc-changes
description: Determine whether the current pull request changes documentation

outputs:
  changed:
    description: Whether the current change set changes documentation
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs.changed == 'true' }}

runs:
  using: composite
  steps:
    - name: Detect changes
      id: filter
      if: ${{ github.event_name == 'pull_request' }}
      uses: dorny/paths-filter@v4
      with:
        filters: |
          changed:
            - '*.md'
            - '**/*.md'
            - 'docs/**'
            - 'LICENSE'
