name: source-changes
description: Determine whether the current change set should run source CI

outputs:
  changed:
    description: Whether the change set contains a non-documentation change
    value: ${{ steps.changes.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Detect source-relevant changes
      id: changes
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        changed=true

        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          pull_number="$(jq -r '.pull_request.number' "${GITHUB_EVENT_PATH}")"
          page=1
          changed=false

          while :; do
            response="$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${pull_number}/files?per_page=100&page=${page}")"

            count="$(jq 'length' <<<"${response}")"

            if [[ "${count}" == "0" ]]; then
              break
            fi

            if jq -e '.[] | .filename | select(test("(^docs/|\\.md$)") | not)' <<<"${response}" >/dev/null; then
              changed=true
              break
            fi

            if (( count < 100 )); then
              break
            fi

            ((page += 1))
          done
        fi

        echo "changed=${changed}" >> "${GITHUB_OUTPUT}"
