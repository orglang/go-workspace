---
name: Setup gear
description: Setup gear
runs:
  using: "composite"
  steps:
    - name: Setup go
      uses: actions/setup-go@v6.2.0
      with:
        go-version-file: engine/go.mod
        cache: true
        cache-dependency-path: |
          engine/go.sum
          engine/gear.mod
          engine/gear.sum
          sdk/go.sum
