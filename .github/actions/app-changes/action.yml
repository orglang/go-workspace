name: app-changes
description: Determine whether the current pull request changes the application

outputs:
  changed:
    description: Whether the current pull request changes this category
    value: ${{ steps.result.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Detect changes
      id: filter
      if: ${{ github.event_name == 'pull_request' }}
      uses: dorny/paths-filter@v4
      with:
        filters: |
          changed:
            - 'app/**'
            - 'db/**'
            - 'lib/**'
            - 'adt/**'
            - 'proto/**'
            - 'go.mod'
            - 'go.sum'

    - name: Set result
      id: result
      shell: bash
      env:
        FILTER_CHANGED: ${{ steps.filter.outputs.changed }}
      run: |
        set -euo pipefail

        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          echo "changed=${FILTER_CHANGED}" >> "${GITHUB_OUTPUT}"
        else
          echo "changed=true" >> "${GITHUB_OUTPUT}"
        fi
