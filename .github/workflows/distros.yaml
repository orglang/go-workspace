name: distros

on:
  workflow_call:
    inputs:
      engine_ref:
        description: Exact go-engine revision under test
        required: true
        type: string
      sdk_ref:
        description: Exact SDK revision to test
        required: true
        type: string
      run:
        description: Whether to run the distros checks
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  distros:
    if: ${{ inputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve workspace ref
        id: workspace-ref
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BRANCH" ]]; then
            if remote_ref="$(git ls-remote --heads https://github.com/orglang/go-workspace.git "refs/heads/$PR_BRANCH")"; then
              if [[ -n "$remote_ref" ]]; then
                ref="$PR_BRANCH"
                reason="matching PR branch"
              else
                ref="main"
                reason="no matching branch"
              fi
            else
              echo "::error::Unable to check whether go-workspace branch '$PR_BRANCH' exists."
              exit 1
            fi
          else
            ref="main"
            reason="not a pull request"
          fi

          echo "Using orglang/go-workspace ref '$ref' ($reason)."
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout workspace
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.workspace-ref.outputs.ref }}
          repository: orglang/go-workspace

      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.engine_ref }}
          repository: orglang/go-engine
          path: engine

      - name: Checkout SDK
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sdk_ref }}
          repository: orglang/go-sdk
          path: sdk

      - uses: ./.github/actions/setup-tools

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: prepare
        run: task engine:sources:generate

      # Expose the Actions cache runtime variables to the inline Buildx CLI.
      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build images
        run: docker buildx bake --load

      - name: check2
        run: task stack:commons

      - name: PostgreSQL compose diagnostics
        if: ${{ failure() }}
        working-directory: stack
        run: >-
          docker compose
          -f ops/postgres.compose.yaml
          -f ops/engine.compose.yaml
          --env-file ops/commons/.env
          logs --no-color || true
