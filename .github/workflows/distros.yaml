name: distros

on:
  workflow_call:
    inputs:
      engine_ref:
        description: Exact go-engine revision under test
        required: true
        type: string
      sdk_ref:
        description: Exact go-sdk revision to test
        required: true
        type: string
      workspace_ref:
        description: go-workspace revision providing this workflow and Taskfiles
        required: true
        type: string
      run:
        description: Whether to run the distros checks
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  distros:
    if: ${{ inputs.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.workspace_ref }}
          repository: orglang/go-workspace

      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.engine_ref }}
          repository: orglang/go-engine
          path: engine

      - name: Checkout SDK
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sdk_ref }}
          repository: orglang/go-sdk
          path: sdk

      - uses: ./.github/actions/setup-tools

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: prepare
        run: task engine:sources:generate

      - name: check1
        run: docker buildx bake --set '*.output=type=cacheonly'

      - name: install
        run: docker buildx bake --load

      - name: check2
        run: task stack:commons

      - name: PostgreSQL compose diagnostics
        if: ${{ failure() }}
        working-directory: stack
        run: >-
          docker compose
          -f ops/postgres.compose.yaml
          -f ops/engine.compose.yaml
          --env-file ops/commons/.env
          logs --no-color || true
