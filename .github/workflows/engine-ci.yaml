name: reusable engine CI

on:
  workflow_call:
    inputs:
      engine_ref:
        description: Exact go-engine revision under test
        required: true
        type: string
      sdk_ref:
        description: Exact go-sdk revision to test
        required: true
        type: string
      workspace_ref:
        description: go-workspace revision providing this workflow and Taskfiles
        required: true
        type: string
      stage:
        description: CI stage
        required: true
        type: string
    outputs:
      result:
        description: Stage result
        value: ${{ jobs.sources.outputs.result }}
      stage:
        description: Executed stage
        value: ${{ jobs.sources.outputs.stage }}
      engine_sha:
        description: Exact engine revision tested
        value: ${{ jobs.sources.outputs.engine_sha }}

permissions:
  contents: read

jobs:
  sources:
    if: ${{ inputs.stage == 'sources' }}
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.result.outputs.result }}
      stage: ${{ steps.meta.outputs.stage }}
      engine_sha: ${{ steps.meta.outputs.engine_sha }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.workspace_ref }}
          repository: orglang/go-workspace

      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.engine_ref }}
          repository: orglang/go-engine
          path: engine

      - name: Checkout SDK
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sdk_ref }}
          repository: orglang/go-sdk
          path: sdk

      - uses: ./.github/actions/setup-tools

      - name: Record stage metadata
        id: meta
        shell: bash
        run: |
          echo "stage=sources" >> "$GITHUB_OUTPUT"
          echo "engine_sha=$(git -C engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run sources checks
        run: task sources

      - name: Report success
        id: result
        if: success()
        shell: bash
        run: echo "result=success" >> "$GITHUB_OUTPUT"
