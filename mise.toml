[settings]
lockfile = true

[tasks."deps:lock"]
description = "Update Docker toolchain lockfiles"
run = [
  "mise -E distros-dev lock",
  "mise -E distros-run lock",
]

[tasks."sources:generate"]
description = "Generate specs and sources for all components"
run = [
  "mise -C engine exec -- task specs:generate",
  "mise -C engine exec -- task sources:generate",
]

[tasks.sources]
alias = "src"
description = "Generate all sources"
depends = ["sources:generate"]

[tasks."binaries:build"]
description = "Test and build component binaries"
run = "mise -C engine exec -- task binaries"

[tasks.binaries]
alias = "bins"
description = "Test and build all binaries"
depends = ["binaries:build"]

[tasks."distros:build"]
description = "Build all distribution artifacts"
run = "docker buildx bake"

[tasks.distros]
description = "Build all distros"
depends = ["distros:build"]

[tasks.stand]
description = "Start specified stand"
usage = 'arg "<ops>" help="Stack operations profile" { choices "commons" }'
run = '''
set -e
case "{{ usage.ops }}" in
  commons) database=postgres ;;
  *) echo "Unsupported stack profile: {{ usage.ops }}" >&2; exit 2 ;;
esac

cd stack
set +e
docker compose \
  --file "ops/${database}.compose.yaml" \
  --file ops/engine.compose.yaml \
  --env-file "ops/{{ usage.ops }}/.env" \
  up \
  --remove-orphans \
  --pull missing \
  --quiet-pull \
  --detach
status=$?
docker compose \
  --file "ops/${database}.compose.yaml" \
  --file ops/engine.compose.yaml \
  --env-file "ops/{{ usage.ops }}/.env" \
  logs \
  --no-color \
  database \
  schema
exit "$status"
'''

[tasks.stack]
description = "Build specified stack if checks passed"
usage = 'arg "<ops>" help="Stack operations profile" { choices "commons" }'
run = [
  "mise run stand {{ usage.ops }}",
  "mise -C engine exec -- task tests:e2e",
  "echo stack were built",
]
