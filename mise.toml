monorepo_root = true

[monorepo]
config_roots = ["engine"]

[settings]
lockfile = true
experimental = true

[tasks."deps:lock"]
description = "Update Docker toolchain lockfiles"
run = [
  "mise -E distros-dev lock",
  "mise -E distros-run lock",
]

[tasks."distros:package"]
description = "Package distribution artifacts"
tools = { docker-cli = "29.9.3", "aqua:docker/buildx" = "0.39.0" }
run = "docker buildx bake"

[tasks.stand]
description = "Start specified stand"
tools = { docker-cli = "29.9.3", docker-compose = "5.7.1" }
dir = "stack"
usage = 'arg "<ops>" help="Stack operations profile" { choices "commons" }'
run = """
docker compose \
  --file ops/postgres.compose.yaml \
  --file ops/engine.compose.yaml \
  --env-file "ops/{{ usage.ops }}/.env" \
  up \
  --remove-orphans \
  --pull missing \
  --quiet-pull \
  --detach
"""

[tasks.stack]
description = "Build specified stack if checks passed"
usage = 'arg "<ops>" help="Stack operations profile" { choices "commons" }'
run = [
  "mise run stand {{ usage.ops }}",
  "mise -C engine run tests:e2e",
  "echo stack were built",
]

[tasks."distros:gate"]
description = "Run engine Binaries and workspace Distros checks"
depends = ["//engine:binaries:gate"]
dir = "engine"
sources = [
  "Dockerfile",
  "Dockerfile.*",
  "**/Dockerfile",
  "**/Dockerfile.*",
  "*.Dockerfile",
  "**/*.Dockerfile",
  ".dockerignore",
  "compose.yaml",
  "compose.yml",
  "*.compose.yaml",
  "*.compose.yml",
  "**/compose.yaml",
  "**/compose.yml",
  "**/*.compose.yaml",
  "**/*.compose.yml",
  "../stack/**",
]
outputs = []
run = [
  { task = ":distros:package" },
  { task = ":stack", args = ["commons"] },
]
