monorepo_root = true

[monorepo]
config_roots = ["engine"]

[settings]
lockfile = true
experimental = true

[tasks."deps:lock"]
description = "Update Docker toolchain lockfiles"
run = [
  "mise -E distros-dev lock",
  "mise -E distros-run lock",
]

[tasks."distros:package"]
description = "Package distribution artifacts"
tools = { docker-cli = "29.9.3", "aqua:docker/buildx" = "0.39.0" }
run = "docker buildx bake"

[tasks.stand]
description = "Start specified stand"
tools = { docker-cli = "29.9.3", docker-compose = "5.7.1" }
dir = "stack"
usage = 'arg "<target>" help="Deployment target" { choices "commons" }'
run = """
docker compose \
  --file ops/postgres.compose.yaml \
  --file ops/engine.compose.yaml \
  --env-file "ops/{{ usage.target }}/.env" \
  up \
  --remove-orphans \
  --pull missing \
  --quiet-pull \
  --detach
"""

[tasks."distros:deploy"]
description = "Deploy the packaged distro to the selected target"
usage = 'arg "<target>" help="Deployment target" { choices "commons" }'
run = "mise run stand {{ usage.target }}"

[tasks."distros:e2e-test"]
description = "Run end-to-end tests against the selected deployment"
usage = 'arg "<target>" help="Deployment target" { choices "commons" }'
run = "mise -C engine exec -- go test -failfast ./test/..."

[tasks."distros:gate"]
description = "Run the Engine Binaries gate and Workspace Distros lifecycle"
depends = ["//engine:binaries:gate"]
usage = 'arg "<target>" help="Deployment target" { choices "commons" }'
dir = "engine"
sources = [
  "Dockerfile",
  "Dockerfile.*",
  "**/Dockerfile",
  "**/Dockerfile.*",
  "*.Dockerfile",
  "**/*.Dockerfile",
  ".dockerignore",
  "compose.yaml",
  "compose.yml",
  "*.compose.yaml",
  "*.compose.yml",
  "**/compose.yaml",
  "**/compose.yml",
  "**/*.compose.yaml",
  "**/*.compose.yml",
  "../stack/**",
]
outputs = []
run = [
  { task = ":distros:package" },
  { task = ":distros:deploy", args = ["{{ usage.target }}"] },
  { task = ":distros:e2e-test", args = ["{{ usage.target }}"] },
]
