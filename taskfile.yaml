version: '3'

includes:
  engine:
    taskfile: ./engine/taskfile.yaml
    dir: ./engine
  sdk:
    taskfile: ./sdk/taskfile.yaml
    dir: ./sdk

vars:
  DB:
    map:
      commons: postgres

tasks:
  sources:
    aliases: [src]
    desc: Build all sources if checks passed
    cmds:
      - task: engine:sources
      # TODO(#9): Re-enable SDK source linters after fixing the existing findings.
      # https://github.com/orglang/go-engine/issues/9
      # - task: sdk:sources

  binaries:
    aliases: [bins]
    desc: Build all binaries if checks passed
    cmds:
      - task: engine:binaries

  distros:
    desc: Build all distros
    cmds:
      - cmd: docker buildx bake

  stack:*:
    desc: Build specified stack if checks passed
    cmds:
      - task: stand:{{index .MATCH 0}}
      - task: engine:tests:e2e
      - cmd: echo stack were built

  stand:*:
    desc: Start specified stand
    vars:
      OPS: '{{index .MATCH 0}}'
    dir: stack
    cmds:
      - cmd: >-
          docker compose
          --file ops/{{index .DB .OPS}}.compose.yaml
          --env-file ops/{{.OPS}}/.env
          up
          --remove-orphans
          --pull missing
          --quiet-pull
          --detach
      # - cmd: >-
      #     docker compose
      #     --file ops/{{index .DB .OPS}}.compose.yaml
      #     --file ops/engine.compose.yaml
      #     --env-file ops/{{.OPS}}/.env
      #     up
      #     --remove-orphans
      #     --pull missing
      #     --quiet-pull
      #     --detach
