version: '3'

includes:
  engine:
    taskfile: ./engine/taskfile.yaml
    dir: ./engine
  sdk:
    taskfile: ./sdk/taskfile.yaml
    dir: ./sdk

vars:
  DB:
    map:
      commons: postgres

tasks:
  sources:generate:
    desc: Generate specs and sources for all components
    cmds:
      - task: engine:specs:generate
      - task: engine:sources:generate

  sources:
    aliases: [src]
    desc: Generate all sources
    cmds:
      - task: sources:generate
      # TODO(#9): Re-enable SDK source linters after fixing the existing findings.
      # https://github.com/orglang/go-workspace/issues/9
      # - task: sdk:sources

  binaries:build:
    desc: Test and build component binaries
    cmds:
      - task: engine:binaries

  binaries:
    aliases: [bins]
    desc: Test and build all binaries
    cmds:
      - task: binaries:build

  distros:build:
    desc: Build all distribution artifacts
    cmds:
      - cmd: docker buildx bake

  distros:
    desc: Build all distros
    cmds:
      - task: distros:build

  stack:*:
    desc: Build specified stack if checks passed
    cmds:
      - task: stand:{{index .MATCH 0}}
      - task: engine:tests:e2e
      - cmd: echo stack were built

  stand:*:
    desc: Start specified stand
    vars:
      OPS: '{{index .MATCH 0}}'
    dir: stack
    cmds:
      - cmd: |
          set +e
          docker compose \
            --file ops/{{index .DB .OPS}}.compose.yaml \
            --file ops/engine.compose.yaml \
            --env-file ops/{{.OPS}}/.env \
            up \
            --remove-orphans \
            --pull missing \
            --quiet-pull \
            --detach
          status=$?
          docker compose \
            --file ops/{{index .DB .OPS}}.compose.yaml \
            --file ops/engine.compose.yaml \
            --env-file ops/{{.OPS}}/.env \
            logs \
            --no-color \
            database \
            schema
          exit $status
